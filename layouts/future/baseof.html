<!doctype html>
<html lang="en" data-palette="arcade">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Yi Chen — machine learning researcher working on crowdsourcing, preference learning, and reliable AI."
    >
    <meta name="theme-color" content="#090018">
    <meta name="color-scheme" content="dark">
    <title>{{ if eq .Layout "notes" }}Strategy Guides // {{ end }}Yi Chen // Arcade Mode</title>

    {{ $favicon := resources.Get "images/favicon.ico" }}
    {{ with $favicon }}<link rel="icon" type="image/x-icon" href="{{ .RelPermalink }}">{{ end }}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/future/arcade.css" | relURL }}">
    <script>document.documentElement.classList.add("has-js");</script>
    <script src="{{ "/future/future.js" | relURL }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="ambient-layer" aria-hidden="true">
      <canvas id="signal-field"></canvas>
      <div class="ambient-grid"></div>
      <div class="scanlines"></div>
    </div>

    <div class="boot-screen" data-boot-screen aria-hidden="true">
      <div class="boot-screen__frame">
        <p class="boot-screen__brand">YC ARCADE <span>8-BIT EDITION</span></p>
        <div class="boot-screen__meter"><span></span></div>
        <div class="boot-screen__log" aria-hidden="true">
          <span>&gt; checking coin slot...</span>
          <span>&gt; loading player profile...</span>
          <span>&gt; player one ready!</span>
        </div>
      </div>
    </div>

    {{ block "main" . }}{{ end }}

    {{ if .Params.math }}
      <script>
        window.MathJax = {
          tex: {
            inlineMath: [["$", "$"], ["\\(", "\\)"]],
            processEscapes: true,
            macros: {
              vec: ["\\mathbf{#1}", 1],
              vx: "\\vec{x}",
              vw: "\\vec{w}",
              sign: "\\textrm{sign}",
              norm: ["\\left\\lVert#1\\right\\rVert", 1],
              st: "\\textrm{subject to:}"
            }
          },
          chtml: { adaptiveCSS: true }
        };
      </script>
      <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {{ end }}
  </body>
</html>
